<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>3D Gaussian Splat Viewer</title>
    <style>
        body { margin: 0; background-color: #111; overflow: hidden; }
        #label { position: fixed; top: 12px; left: 16px; color: #ddd; font: 14px/1.4 system-ui, sans-serif;
                 background: rgba(0, 0, 0, 0.5); padding: 4px 10px; border-radius: 4px; pointer-events: none; }
    </style>
    <!-- Import Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/PLYLoader.js"></script>
</head>
<body>
    <div id="label">Loading…</div>
    <script>
        // Setup Scene
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 2;

        const renderer = new THREE.WebGLRenderer();
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Add Mouse Controls (Spin and Zoom)
        const controls = new THREE.OrbitControls(camera, renderer.domElement);

        // Create a soft circle texture to simulate the "Gaussian Splat"
        const canvas = document.createElement('canvas');
        canvas.width = 32; canvas.height = 32;
        const ctx = canvas.getContext('2d');
        const gradient = ctx.createRadialGradient(16, 16, 0, 16, 16, 16);
        gradient.addColorStop(0, 'rgba(255,255,255,1)');
        gradient.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, 32, 32);
        const texture = new THREE.CanvasTexture(canvas);

        // Load the PLY files generated by my CUDA C++ code. All .ply files in
        // data/ply/ are listed (from the dev server's directory listing);
        // Space shows the next one, Shift+Space the previous one.
        const PLY_DIR = '../data/ply/';
        // Splat size is in screen pixels (set per cloud in fitCamera): with world-sized
        // splats the far points would shrink to nothing, since depth runs from 1 to 10
        const material = new THREE.PointsMaterial({
            size: 3,
            sizeAttenuation: false,
            vertexColors: true,
            map: texture,
            transparent: true,
            alphaTest: 0.1
        });
        const loader = new THREE.PLYLoader();
        const label = document.getElementById('label');
        let files = [];
        let current = 0;
        let pointCloud = null;
        let loadId = 0;

        // Put the camera where the photo was taken (the origin of the un-centred cloud),
        // with the photo's field of view, so the first view matches the photo. Then
        // size the splats (in screen pixels) to the spacing between neighbouring points.
        function fitCamera(geometry) {
            const pos = geometry.attributes.position;
            geometry.computeBoundingBox();
            const c = geometry.boundingBox.getCenter(new THREE.Vector3());
            let slopeX = 0, slopeY = 0;
            for (let i = 0; i < pos.count; i += 7) {
                const z = pos.getZ(i);
                slopeX = Math.max(slopeX, Math.abs(pos.getX(i)) / z);
                slopeY = Math.max(slopeY, Math.abs(pos.getY(i)) / z);
            }
            camera.fov = 2 * Math.atan(slopeY) * 180 / Math.PI;
            camera.near = 0.01;
            camera.far = 100 * geometry.boundingBox.max.z;
            camera.updateProjectionMatrix();
            // centred, then rotated by PI around x: (x, y, z) -> (x, -y, -z)
            // and look straight along the photo's axis (-z), orbiting around the cloud's middle depth
            camera.position.set(-c.x, c.y, c.z);
            controls.target.set(-c.x, c.y, 0);
            controls.update();
            // the points form a grid with the photo's aspect ratio (slopeX / slopeY)
            const rows = Math.sqrt(pos.count * slopeY / slopeX);
            material.size = Math.max(1.5, 2 * window.innerHeight / rows);
        }

        function show(index) {
            current = (index + files.length) % files.length;
            const name = files[current];
            const id = ++loadId;
            label.textContent = `${name}  (${current + 1}/${files.length})  loading…`;
            loader.load(PLY_DIR + encodeURIComponent(name), function (geometry) {
                if (id !== loadId) { geometry.dispose(); return; }  // a newer file was picked meanwhile
                if (pointCloud) {
                    scene.remove(pointCloud);
                    pointCloud.geometry.dispose();
                }
                fitCamera(geometry);
                geometry.center();  // orbit around the middle of the cloud
                pointCloud = new THREE.Points(geometry, material);
                // Center and rotate the model to look correct
                pointCloud.rotation.x = Math.PI;
                scene.add(pointCloud);
                label.textContent = `${name}  (${current + 1}/${files.length})  ·  Space: next  ·  Shift+Space: previous`;
            }, undefined, function () {
                if (id === loadId) label.textContent = `Could not load ${name}`;
            });
        }

        if (location.protocol === 'file:') {
            label.textContent = 'Opened from disk: browsers block loading the .ply files. Run "make server" and open http://localhost:8080/src/index.html';
        } else fetch(PLY_DIR)
            .then(r => r.text())
            .then(html => {
                const links = new DOMParser().parseFromString(html, 'text/html').querySelectorAll('a');
                files = [...links].map(a => decodeURIComponent(a.getAttribute('href')))
                                  .filter(f => f.toLowerCase().endsWith('.ply'))
                                  .sort();
                if (files.length === 0) {
                    label.textContent = 'No .ply files in data/ply/ (run make run-splat)';
                    return;
                }
                const wanted = new URLSearchParams(location.search).get('ply');
                show(Math.max(0, files.indexOf(wanted)));
            })
            .catch(() => { label.textContent = 'Could not list data/ply/ (start it with make serve)'; });

        window.addEventListener('keydown', function (e) {
            if (e.code !== 'Space' || files.length === 0) return;
            e.preventDefault();
            show(current + (e.shiftKey ? -1 : 1));
        });

        window.addEventListener('resize', function () {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Animation Loop
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
